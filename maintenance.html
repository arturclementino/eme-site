<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site em Manutenção — Escola de Música Esperança (EME)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0D1117;
            color: #FFFFFF;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .maintenance-card {
            background: #161B22;
            border: 1px solid #30363D;
            border-radius: 16px;
            padding: 48px 36px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .logo-title {
            font-family: 'Cinzel', serif;
            color: #D4AF37;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .logo-sub {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8B949E;
            margin-bottom: 28px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #F0F6FC;
            margin-bottom: 16px;
        }
        p {
            font-size: 15px;
            color: #8B949E;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .contact-box {
            background: #0D1117;
            border: 1px solid #21262D;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
        }
        .contact-box strong {
            color: #C9D1D9;
            font-size: 14px;
            display: block;
            margin-bottom: 10px;
        }
        .contact-item {
            font-size: 14px;
            color: #8B949E;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .contact-item:last-child { margin-bottom: 0; }
        .contact-item a {
            color: #58A6FF;
            text-decoration: none;
        }
        .contact-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="logo-title">EME</div>
        <div class="logo-sub">Escola de Música Esperança</div>
        
        <h1>Site em Manutenção</h1>
        <p>Estamos realizando atualizações e melhorias em nossa plataforma para oferecer uma experiência ainda melhor. Volte em breve!</p>
        
        <div class="contact-box">
            <strong>Entre em contato conosco:</strong>
            <div class="contact-item">
                📧 <span>Email: <a href="mailto:pastoral.liturgica@igrejaesperanca.org.br">pastoral.liturgica@igrejaesperanca.org.br</a></span>
            </div>
            <div class="contact-item">
                📍 <span>Localização: Belo Horizonte — MG</span>
            </div>
        </div>
    </div>
</body>
</html>
